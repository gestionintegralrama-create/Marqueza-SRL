<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14213D"><meta name="apple-mobile-web-app-capable" content="yes"><title>Marqueza SRL · Sistema de Pedidos</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-2:#EFEADF;
    --ink:#1F2A37;
    --ink-soft:#5B6472;
    --navy:#14213D;
    --navy-2:#1D3059;
    --teal:#1E7A63;
    --teal-soft:#E4F1EC;
    --amber:#C07A2A;
    --amber-soft:#F6E9D6;
    --red:#B3412E;
    --red-soft:#F6E3DE;
    --line:#D9D2C2;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  .font-display{font-family:'Zilla Slab',serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid transparent;transition:transform .08s ease, filter .1s ease;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{filter:brightness(1.12);}
  .btn-accent{background:var(--teal);color:#fff;}
  .btn-accent:hover{filter:brightness(1.1);}
  .btn-amber{background:var(--amber);color:#fff;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-ghost:hover{background:var(--paper-2);}
  .btn-danger{background:var(--red-soft);color:var(--red);}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  input[type=text],input[type=number],input[type=date],input[type=password],input[type=tel],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-2);outline-offset:1px;}
  label.field-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);display:block;margin-bottom:4px;}

  .card{background:#fff;border:1px solid var(--line);border-radius:10px;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;}

  .stamp{
    display:inline-flex;align-items:center;justify-content:center;
    border:2px solid currentColor;border-radius:8px;
    padding:4px 12px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px;
    letter-spacing:.08em;text-transform:uppercase;transform:rotate(-3deg);
  }

  .remito{position:relative;}
  .remito .perforation{
    border-top:2px dashed var(--line);position:relative;margin:14px 0;
  }
  .remito .perforation::before,.remito .perforation::after{
    content:'';position:absolute;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--paper);
  }
  .remito .perforation::before{left:-22px;}
  .remito .perforation::after{right:-22px;}

  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:7px;color:#C7CEDC;font-weight:600;font-size:13.5px;cursor:pointer;}
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:rgba(255,255,255,.12);color:#fff;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid var(--paper-2);vertical-align:middle;}
  tr:hover td{background:var(--paper-2);}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;z-index:50;}
  .modal-box{background:var(--paper);border-radius:12px;max-width:640px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);}

  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;top:0;left:0;width:100%;}
    #print-multi-area, #print-multi-area *{visibility:visible;}
    #print-multi-area{position:absolute;top:0;left:0;width:100%;display:block !important;}
  }
  .comanda-print{border:1px solid #999;border-radius:8px;padding:16px 18px;margin-bottom:16px;page-break-inside:avoid;}

.tw{overflow-x:auto}.tw table{min-width:480px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{padding:12px 14px}.kpi b{display:block;font-family:'Zilla Slab',serif;font-size:24px}
.sm{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
@media(max-width:768px){
 .shell{flex-direction:column}
 .sidebar{position:fixed;bottom:0;left:0;right:0;width:100%!important;height:62px;flex-direction:row!important;padding:4px!important;z-index:40;overflow-x:auto;box-shadow:0 -2px 10px rgba(0,0,0,.2)}
 .sidebar>div:first-child{display:none}
 .navlist{flex-direction:row!important;flex:1!important;gap:0!important}
 .nav-item{flex-direction:column;gap:1px;padding:5px 9px;font-size:10px;min-width:62px;justify-content:center;text-align:center;white-space:nowrap}
 .nav-item span{font-size:17px}
 .topbar{padding:10px 12px!important;flex-wrap:wrap;gap:6px}
 .content{padding:12px 10px 84px!important}
 [style*="grid-template-columns"]:not([style*="auto-fit"]),.g2{grid-template-columns:1fr!important}
 input,select,textarea{font-size:16px!important}
 .btn{min-height:40px}.btn-sm{min-height:36px}
 table{font-size:12.5px}
 .modal-overlay{padding:0}.modal-box{border-radius:0;min-height:100vh;max-width:100%!important}
 [style*="bottom:20px"]{bottom:74px!important;left:12px;right:12px}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================= ESTADO Y PERSISTENCIA ============================= */
const DEFAULT_DB = () => ({
  config: { adminEmail: "gestionmarqueza@gmail.com", adminPassword: "", adminPasswordEnabled: false },
  products: [],
  clients: [],
  orders: [],
  stockmoves: [], branches: [], transfers: [], sales: [], closings: [], requests: []
});

let DB = DEFAULT_DB();
let LOADED = false;
let SAVING = false;

const state = {
  role: null,           // 'admin' | 'operario' | null
  loginError: "",
  view: "dashboard",     // vista actual
  modal: null,           // {type, payload}
  filters: { orderStatus: "todos", productSearch: "" },
  toast: null
};

/* ===== SUPABASE: completar con los datos de tu proyecto (Project Settings → API) ===== */
const SUPA={url:"https://vtzagoslmupeqlcmatgm.supabase.co",key:"sb_publishable_HVJbfZ9Rvz4wopydGY1ImQ_Yx7ypVfh"};   // key = "anon public" (es pública; la seguridad la dan las reglas RLS)
const COLLS=["products","clients","orders","stockmoves","branches","transfers","sales","closings","requests"];
let AUTH=null, PROFILE=null, PROFS=[], POLL=null; const SNAP={};
const uMail=u=>{u=String(u).trim().toLowerCase();return u.includes("@")?u:u.replace(/[^a-z0-9._-]/g,"")+"@marqueza.app";};
const cl=(k,r)=>k==="products"?{...r,stock:undefined,stockBy:undefined}:r;
const scope=(k,r)=>k==="transfers"?{sucursal_id:r.origen,sucursal_id2:r.destino}:["sales","closings","requests","stockmoves","orders"].includes(k)?{sucursal_id:r.sucursalId||mainBranch()}:{};
function setAuth(j){AUTH={token:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000,uid:j.user.id};localStorage.setItem("mq_auth",JSON.stringify(AUTH));}
async function authCall(path,body){return fetch(SUPA.url+"/auth/v1/"+path,{method:"POST",headers:{apikey:SUPA.key,"Content-Type":"application/json"},body:JSON.stringify(body)});}
async function refreshAuth(){const r=await authCall("token?grant_type=refresh_token",{refresh_token:AUTH.refresh});if(!r.ok)throw new Error("Sesión vencida");setAuth(await r.json());}
async function API(p,o={}){
  if(AUTH&&Date.now()>AUTH.exp) await refreshAuth();
  return fetch(SUPA.url+p,{...o,headers:{apikey:SUPA.key,...(AUTH?{Authorization:"Bearer "+AUTH.token}:{}),"Content-Type":"application/json",...(o.headers||{})}});
}
async function storageSet(key,value){
  try{
    if(key==="config") return true;
    const old=SNAP[key]||{}, now={}, up=[];
    value.forEach(r=>{const c=cl(key,r),j=JSON.stringify(c);now[r.id]=j;if(old[r.id]!==j)up.push({coll:key,id:r.id,data:c,...scope(key,r)});});
    const del=Object.keys(old).filter(i=>!(i in now));
    if(up.length){const r=await API("/rest/v1/records?on_conflict=coll,id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(up)});if(!r.ok)return false;}
    if(del.length){const r=await API(`/rest/v1/records?coll=eq.${key}&id=in.(${del.map(i=>'"'+i+'"').join(",")})`,{method:"DELETE"});if(!r.ok)return false;}
    SNAP[key]=now; return true;
  }catch(e){return false;}
}
async function pull(){
  const rows=[];
  for(let i=0;;i+=1000){
    const r=await API("/rest/v1/records?select=coll,id,data&order=created_at.asc",{headers:{Range:`${i}-${i+999}`,"Range-Unit":"items"}});
    if(r.status===401){await doLogout();throw new Error("401");}
    if(!r.ok)throw new Error("Error de lectura");
    const j=await r.json();rows.push(...j);if(j.length<1000)break;
  }
  COLLS.forEach(k=>{DB[k]=[];});
  rows.forEach(x=>{if(DB[x.coll])DB[x.coll].push(x.data);});
  DB.stockmoves.reverse(); fixDB(); recalcStock();
  COLLS.forEach(k=>{SNAP[k]={};DB[k].forEach(r=>SNAP[k][r.id]=JSON.stringify(cl(k,r)));});
  if(PROFILE.rol==="admin"){
    await storageSet("branches",DB.branches);
    const r=await API("/rest/v1/profiles?select=*&order=nombre");PROFS=r.ok?await r.json():[];
  }
}
function recalcStock(){
  DB.products.forEach(p=>p.stockBy={});
  DB.stockmoves.forEach(m=>{const p=productById(m.productId);if(!p)return;const b=m.sucursalId||mainBranch();p.stockBy[b]=(p.stockBy[b]||0)+(m.tipo==="entrada"?m.cantidad:-m.cantidad);});
  DB.products.forEach(p=>p.stock=totalStock(p));
}
async function enter(){
  const r=await API("/rest/v1/profiles?id=eq."+AUTH.uid+"&select=*");const p=r.ok?(await r.json())[0]:null;
  if(!r.ok) throw new Error("No se pudo leer el perfil [código "+r.status+"]. Revisá que se haya ejecutado el SQL.");
  if(!p) throw new Error("La cuenta existe pero no tiene perfil en la tabla profiles. Ejecutá restablecer_admin.sql.");
  if(p.activo===false) throw new Error("Tu usuario está deshabilitado.");
  PROFILE=p; state.role=p.rol==="admin"?"admin":p.rol==="vendedor"?"sucursal":"operario"; state.branchId=p.sucursal_id;
  state.view=p.rol==="admin"?"dashboard":p.rol==="vendedor"?"venta":"produccion";
  await pull();
  clearInterval(POLL);
  POLL=setInterval(async()=>{ if(!AUTH||state.modal||SAVING||document.activeElement?.matches?.("input,select,textarea"))return; try{await pull();render();}catch(e){} },20000);
}
async function doLogin(u,p){
  try{
    const r=await authCall("token?grant_type=password",{email:uMail(u),password:p});
    if(!r.ok){const j=await r.json().catch(()=>({}));const m=String(j.msg||j.error_description||"");throw new Error(/confirm/i.test(m)?"El usuario no está confirmado en Supabase (Authentication → Users → Auto Confirm).":/disabled/i.test(m)?"El ingreso con email está deshabilitado en Supabase.":"Usuario o contraseña incorrectos ["+r.status+" "+(j.error_code||m||"")+"]");}
    setAuth(await r.json()); await enter(); state.loginError="";
  }catch(e){AUTH=null;PROFILE=null;state.role=null;state.loginError=e instanceof TypeError?"No se pudo conectar con Supabase. Revisá la URL y la clave en el archivo.":(e.message||"Error al ingresar");}
  render();
}
async function doLogout(){clearInterval(POLL);AUTH=null;PROFILE=null;localStorage.removeItem("mq_auth");DB=DEFAULT_DB();state.role=null;state.cart=[];state.modal=null;render();}

async function loadAll(){
  try{const a=localStorage.getItem("mq_auth"); if(a&&SUPA.url){AUTH=JSON.parse(a);await enter();}}catch(e){AUTH=null;PROFILE=null;state.role=null;}
  LOADED=true; render();
}

async function persist(key){
  SAVING = true; render();
  const ok = await storageSet(key, DB[key]);
  SAVING = false; render();
  if(!ok) showToast("No se pudo guardar en la base de datos compartida. Revisá tu conexión y volvé a intentar.","error");
  return ok;
}

function showToast(msg, kind="ok"){
  state.toast = {msg, kind};
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 2600);
}

/* ============================= HELPERS ============================= */
function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; }
function fmtMoney(n){ return "$" + Number(n||0).toLocaleString("es-AR",{minimumFractionDigits:2, maximumFractionDigits:2}); }
function nextOrderCode(){
  const n = DB.orders.length + 1;
  return "P-" + String(n).padStart(4,"0");
}
function escapeHtml(s){ return String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const STATUS_META = {
  pendiente:       { label:"Pendiente",        color:"#5B6472", bg:"#E7E5DE" },
  en_preparacion:  { label:"En preparación",   color:"#1D4E89", bg:"#DCE7F5" },
  listo:           { label:"Listo",            color:"#1E7A63", bg:"#E4F1EC" },
  en_reparto:      { label:"En reparto",       color:"#C07A2A", bg:"#F6E9D6" },
  entregado:       { label:"Entregado",        color:"#8C4FB0", bg:"#EEE3F5" },
  rendido:         { label:"Rendido",          color:"#14213D", bg:"#E1E4EC" },
};

function badge(status){
  const m = STATUS_META[status] || STATUS_META.pendiente;
  return `<span class="badge" style="background:${m.bg};color:${m.color}">${m.label}</span>`;
}

function productById(id){ return DB.products.find(p=>p.id===id); }
function clientById(id){ return DB.clients.find(c=>c.id===id); }

function orderTotal(order){
  return order.items.reduce((s,it)=> s + (Number(it.cantidad)*Number(it.precioUnitario)), 0);
}

function lowStockProducts(){ return DB.products.filter(p => Number(p.stock) <= Number(p.stockMinimo ?? 5)); }

/* ============================= ACCIONES DE DATOS ============================= */
async function addStockMove({productId, tipo, cantidad, motivo, ordenId, branchId, ref}){
  const p = productById(productId); if(!p) return;
  DB.stockmoves.unshift({id:uid("mov"), productId, productoNombre:p.nombre, tipo, cantidad:Number(cantidad), motivo:motivo||"", ordenId:ordenId||null, sucursalId:branchId||curBranch(), ref:ref||null, usuario:PROFILE?.nombre||"", fecha:new Date().toISOString()});
  recalcStock(); await persist("stockmoves");
}

async function saveOrder(order){
  const idx = DB.orders.findIndex(o=>o.id===order.id);
  if(idx>=0) DB.orders[idx] = order; else DB.orders.push(order);
  await persist("orders");
}

async function transitionOrder(order, newStatus, extra={}){
  Object.assign(order, extra, {estado:newStatus});
  if(newStatus === "listo" && !order._stockDescontado){
    for(const it of order.items){
      await addStockMove({productId:it.productId, tipo:"salida", cantidad:it.cantidad, motivo:`Preparación pedido ${order.codigo}`, ordenId:order.id, branchId:order.sucursalId||mainBranch()});
    }
    order._stockDescontado = true;
  }
  await saveOrder(order);
  showToast(`Pedido ${order.codigo} → ${STATUS_META[newStatus].label}`);
}

/* ============================= RENDER RAÍZ ============================= */
function render(){
  const root = document.getElementById("root");
  if(!LOADED){
    root.innerHTML = renderLoading();
    return;
  }
  if(!state.role){
    root.innerHTML = renderLogin();
    bindLogin();
    return;
  }
  root.innerHTML = renderShell();
  bindShell();
}

function renderLoading(){
  return `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--ink-soft)">
    <div class="font-display" style="font-size:22px;color:var(--navy)">Marqueza SRL</div>
    <div class="font-mono" style="font-size:12.5px;letter-spacing:.05em">Cargando datos del sistema…</div>
  </div>`;
}

/* ============================= LOGIN ============================= */
function renderLogin(){
  return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 15% 10%, #1D3059 0%, #14213D 45%, #101a30 100%);padding:20px;">
  <div class="card" style="width:100%;max-width:400px;padding:30px;border-radius:14px;"><div style="text-align:center;margin-bottom:20px"><div class="stamp" style="color:var(--teal);margin-bottom:12px">Sistema interno</div><div class="font-display" style="font-size:28px;font-weight:700;color:var(--navy)">Marqueza SRL</div></div>
  ${SUPA.url?`<form id="lf" style="display:flex;flex-direction:column;gap:10px"><div><label class="field-label">Usuario</label><input type="text" id="lu" autocapitalize="off" autocomplete="username" value="${esc(state.lu||"")}"></div><div><label class="field-label">Contraseña</label><input type="password" id="lp" autocomplete="current-password"></div>${state.loginError?`<div style="color:var(--red);font-size:13px">${esc(state.loginError)}</div>`:""}<button class="btn btn-primary" style="justify-content:center" ${state.busy?"disabled":""}>${state.busy?"Ingresando…":"Ingresar"}</button></form>`:`<div style="color:var(--red);font-size:13.5px">Falta configurar Supabase: completá <b>url</b> y <b>key</b> en la constante SUPA del index.html.</div>`}</div></div>`;
}
function bindLogin(){const f=document.getElementById("lf");if(f)f.onsubmit=async e=>{e.preventDefault();state.lu=document.getElementById("lu").value;state.busy=true;render();await doLogin(state.lu,document.getElementById("lp").value);state.busy=false;render();};}

/* ============================= SHELL (NAV + VISTA) ============================= */
const ADMIN_NAV = [
  {id:"dashboard", label:"Resumen", icon:"◆"},
  {id:"pedidos", label:"Pedidos", icon:"▤"},
  {id:"reparto", label:"Reparto", icon:"▶"},
  {id:"caja", label:"Caja", icon:"$"},
  {id:"sucursales", label:"Sucursales", icon:"⌂"},{id:"stock", label:"Stock x sucursal", icon:"▣"},{id:"envios", label:"Envíos", icon:"⇄"},{id:"cierres", label:"Cierres de caja", icon:"✔"},
  {id:"productos", label:"Productos y precios", icon:"▦"},
  {id:"clientes", label:"Clientes", icon:"◍"},
  {id:"reportes", label:"Reportes", icon:"▥"},
  {id:"ventas", label:"Ventas", icon:"$"},{id:"novedades", label:"Novedades", icon:"✉"},{id:"usuarios", label:"Usuarios", icon:"☺"},
];

function renderShell(){
  const isAdmin = state.role === 'admin';
  const nav = isAdmin ? ADMIN_NAV : state.role==='sucursal' ? SUC_NAV : [{id:"produccion", label:"Producción", icon:"▤"}];
  return `
  <div class="shell" style="display:flex;min-height:100vh;">
    <div class="sidebar" style="width:220px;background:var(--navy);flex-shrink:0;padding:18px 12px;display:flex;flex-direction:column;">
      <div style="padding:6px 10px 18px 10px;">
        <div class="font-display" style="color:#fff;font-size:19px;font-weight:700;">Marqueza SRL</div>
        <div class="font-mono" style="color:#8B93A7;font-size:10.5px;letter-spacing:.05em;margin-top:2px;">
          ${isAdmin ? "PANEL ADMINISTRACIÓN" : state.role==='sucursal' ? "SUCURSAL · "+esc(branchName(state.branchId)).toUpperCase() : "PANEL PRODUCCIÓN"}
        </div>
      </div>
      <div class="navlist" style="display:flex;flex-direction:column;gap:2px;flex:1;">
        ${nav.map(n => `<div class="nav-item ${state.view===n.id?'active':''}" data-nav="${n.id}"><span>${n.icon}</span>${n.label}</div>`).join("")}
      </div>
      <div class="nav-item" id="btn-logout" style="color:#E4B0A5;">⏻ Cerrar sesión</div>
    </div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
      <div class="topbar" style="padding:14px 26px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;">
        <div class="font-display" style="font-size:19px;font-weight:600;color:var(--navy);">${viewTitle()}</div>
        <div style="display:flex;align-items:center;gap:10px;">
          ${isAdmin ? `<select id="vb-sel" style="width:auto;max-width:180px;"><option value="all">Todas las sucursales</option>${DB.branches.map(b=>`<option value="${b.id}" ${vb()===b.id?"selected":""}>${esc(b.nombre)}</option>`).join("")}</select>` : ""}

      </div>
      <div class="content" style="padding:22px 26px;flex:1;overflow-y:auto;">

function viewTitle(){
  const titles = {
    dashboard:"Resumen general", pedidos:"Pedidos y presupuestos", reparto:"Reparto",
    caja:"Rendición de caja", productos:"Productos y stock", clientes:"Clientes",
    reportes:"Reportes", ajustes:"Ajustes", produccion:"Órdenes de producción"
  };
  return titles[state.view] || VT[state.view] || "";
}

function renderToast(){
  const kind = state.toast.kind;
  const bg = kind==="error" ? "var(--red)" : "var(--teal)";
  return `<div style="position:fixed;bottom:20px;right:20px;background:${bg};color:#fff;padding:11px 18px;border-radius:8px;font-size:13.5px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.2);z-index:60;">${escapeHtml(state.toast.msg)}</div>`;
}

function renderView(){
  switch(state.view){
    case "dashboard": return renderDashboard();
    case "pedidos": return renderPedidos();
    case "reparto": return renderReparto();
    case "caja": return renderCaja();
    case "productos": return renderProductos();
    case "clientes": return renderClientes();
    case "reportes": return renderReportes();
    case "ajustes": return renderAjustes();
    case "produccion": return renderProduccion();
    default: return VIEWS[state.view] ? VIEWS[state.view]() : "";
  }
}

function bindShell(){
  document.querySelectorAll("[data-nav]").forEach(el => {
    el.onclick = () => { state.view = el.dataset.nav; state.modal=null; render(); };
  });
  const vbS = document.getElementById("vb-sel"); if(vbS) vbS.onchange = () => { state.viewBranch = vbS.value; render(); };
  const logout = document.getElementById("btn-logout");
  if(logout) logout.onclick = doLogout;
  const bp = document.getElementById("btn-pass"); if(bp) bp.onclick = () => { state.modal={type:"chg-pass"}; render(); };
  const rf = document.getElementById("btn-refresh"); if(rf) rf.onclick = async () => { try{await pull();render();showToast("Datos actualizados");}catch(e){} };
  bindView();
}

function bindView(){
  const fns = {
    dashboard: bindDashboard, pedidos: bindPedidos, reparto: bindReparto, caja: bindCaja,
    productos: bindProductos, clientes: bindClientes, reportes: bindReportes, ajustes: bindAjustes,
    produccion: bindProduccion
  };
  if(fns[state.view]) fns[state.view](); else if(VB[state.view]) VB[state.view]();
  if(state.modal) bindModal();
}

function printSelectedComandas(ids){
  if(ids.length===0) return;
  let container = document.getElementById("print-multi-area");
  if(!container){
    container = document.createElement("div");
    container.id = "print-multi-area";
    container.style.display = "none";
    document.body.appendChild(container);
  }
  const orders = ids.map(id => DB.orders.find(o=>o.id===id)).filter(Boolean);
  container.innerHTML = `<div style="font-family:Arial;padding:10px;">

function bindProduccion(){
  document.querySelectorAll("[data-op-start]").forEach(b => b.onclick = async () => {
    const o = DB.orders.find(x=>x.id===b.dataset.opStart);
    await transitionOrder(o, "en_preparacion");
  });
  document.querySelectorAll("[data-op-ready]").forEach(b => b.onclick = async () => {
    const o = DB.orders.find(x=>x.id===b.dataset.opReady);
    await transitionOrder(o, "listo");
  });
  document.querySelectorAll("[data-prod-check]").forEach(cb => cb.onchange = () => {
    state.selectedProd = state.selectedProd || [];
    const id = cb.dataset.prodCheck;
    if(cb.checked){ if(!state.selectedProd.includes(id)) state.selectedProd.push(id); }
    else { state.selectedProd = state.selectedProd.filter(x=>x!==id); }
    render();
  });
  const selAll = document.getElementById("prod-select-all");
  if(selAll) selAll.onclick = () => {
    const relevant = DB.orders.filter(o => ["pendiente","en_preparacion","listo"].includes(o.estado));
    const allSelected = relevant.length>0 && relevant.every(o => (state.selectedProd||[]).includes(o.id));
    state.selectedProd = allSelected ? [] : relevant.map(o=>o.id);
    render();
  };
  const printBtn = document.getElementById("prod-print-selected");
  if(printBtn) printBtn.onclick = () => printSelectedComandas(state.selectedProd||[]);
  bindExportToolbar("exp-prod-op", () => {
    const relevant = DB.orders.filter(o => ["pendiente","en_preparacion","listo"].includes(o.estado));
    const rows = [];
    relevant.forEach(o => o.items.forEach(it => {
      rows.push({
        Código:o.codigo, "Fecha Preparación": fmtDate(o.fechaPreparacion), "Fecha Entrega": fmtDate(o.fechaEntrega),
        Producto: productById(it.productId)?.nombre||"", Cantidad: it.cantidad, Estado: STATUS_META[o.estado].label
      });
    }));
    exportRowsToExcel("produccion_marqueza.xlsx","Producción",rows);
  }, "export-produccion", "produccion_marqueza.png");
}

async function handleExcelImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array"});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
  if(rows.length===0){ showToast("El archivo no tiene filas de datos","error"); return; }

  const findKey = (row, options) => Object.keys(row).find(k => options.includes(k.toLowerCase().trim()));
  let added = 0, updated = 0; const pm=[];
  rows.forEach(row => {
    const kNombre = findKey(row, ["nombre","producto","descripcion","descripción","articulo","artículo"]);
    const kPrecio = findKey(row, ["precio","precio unitario","precio venta"]);
    const kStock = findKey(row, ["stock","cantidad","existencia"]);
    const kUnidad = findKey(row, ["unidad","um","u.m."]);
    const nombre = kNombre ? String(row[kNombre]).trim() : "";
    if(!nombre) return;
    const precio = kPrecio ? Number(String(row[kPrecio]).replace(",",".")) || 0 : 0;
    const stock = kStock ? Number(String(row[kStock]).replace(",",".")) || 0 : 0;
    const unidad = kUnidad ? String(row[kUnidad]).trim() : "unidad";
    const existing = DB.products.find(p => p.nombre.toLowerCase() === nombre.toLowerCase());
    if(existing){
      existing.precio = precio || existing.precio;
      pm.push([existing.id,stock-stockOf(existing,curBranch())]);
      existing.unidad = unidad || existing.unidad;
      updated++;
    } else {
      const np={id:uid("prod"),nombre,precio,stock:0,stockBy:{},unidad,stockMinimo:5}; DB.products.push(np); pm.push([np.id,stock]);
      added++;
    }
  });
  await persist("products");
  for(const [id,d] of pm) if(d) await addStockMove({productId:id,tipo:d>0?"entrada":"salida",cantidad:Math.abs(d),motivo:"Ajuste por importación",branchId:curBranch()});
  showToast(`Importación completa: ${added} nuevos, ${updated} actualizados.`);
  e.target.value = "";
}

/* ============================= MODAL DISPATCH ============================= */
function renderModal(){
  const m = state.modal;
  let inner = "";
  if(m.type==="new-order") inner = renderNewOrderModal(m);
  else if(m.type==="view-order") inner = renderViewOrderModal(m);
  else if(m.type==="edit-product") inner = renderEditProductModal(m);
  else if(m.type==="stock-move") inner = renderStockMoveModal(m);
  else if(m.type==="edit-client") inner = renderEditClientModal(m);
  else if(MODALS[m.type]) inner = MODALS[m.type].r(m);
  return `<div class="modal-overlay" id="modal-overlay">${inner}</div>`;
}

function bindModal(){
  const overlay = document.getElementById("modal-overlay");
  if(overlay) overlay.onclick = (e) => { if(e.target.id==="modal-overlay"){ state.modal=null; render(); } };
  const cancel = document.getElementById("modal-cancel");
  if(cancel) cancel.onclick = () => { state.modal=null; render(); };

  const m = state.modal;
  if(m.type==="new-order") bindNewOrderModal(m);
  else if(m.type==="view-order") bindViewOrderModal(m);
  else if(m.type==="edit-product") bindEditProductModal(m);
  else if(m.type==="stock-move") bindStockMoveModal(m);
  else if(m.type==="edit-client") bindEditClientModal(m);
  else if(MODALS[m.type]) MODALS[m.type].b(m);
}

function bindNewOrderModal(m){
  const clienteSel = document.getElementById("no-cliente");
  clienteSel.onchange = () => { m.clienteId = clienteSel.value || null; render(); };

  document.getElementById("no-add-btn").onclick = () => {
    const pid = document.getElementById("no-add-product").value;
    const qty = Number(document.getElementById("no-add-qty").value);
    if(!pid || !qty || qty<=0){ showToast("Elegí un producto y una cantidad válida","error"); return; }
    const prod = productById(pid);
    m.items.push({productId:pid, cantidad:qty, precioUnitario:prod.precio});
    render();
  };
  document.querySelectorAll("[data-remove-item]").forEach(b => b.onclick = () => {
    m.items.splice(Number(b.dataset.removeItem),1); render();
  });

  document.getElementById("no-save").onclick = async () => {
    let clienteId = clienteSel.value;
    if(clienteId==="__new__"){
      const nombre = document.getElementById("nc-nombre").value.trim();
      if(!nombre){ showToast("Ingresá el nombre del cliente nuevo","error"); return; }
      const nc = {id:uid("cli"), nombre, telefono:document.getElementById("nc-telefono").value.trim(), direccion: document.getElementById("no-ubicacion").value.trim()};
      DB.clients.push(nc);
      await persist("clients");
      clienteId = nc.id;
    }
    if(!clienteId){ showToast("Seleccioná un cliente","error"); return; }
    if(m.items.length===0){ showToast("Agregá al menos un producto","error"); return; }
    const fechaEntrega = document.getElementById("no-fecha-entrega").value;
    if(!fechaEntrega){ showToast("Ingresá la fecha de entrega","error"); return; }

    const order = {
      id: uid("ord"), codigo: nextOrderCode(), clienteId,
      ubicacion: document.getElementById("no-ubicacion").value.trim(),
      fechaPedido: document.getElementById("no-fecha-pedido").value,
      fechaPreparacion: document.getElementById("no-fecha-prep").value,
      fechaEntrega, items: m.items.map(it=>({...it})),
      observaciones: document.getElementById("no-obs").value.trim(),
      estado: "pendiente", repartidor:null, sucursalId: curBranch(), fechaCreacion: new Date().toISOString()
    };
    await saveOrder(order);
    state.modal = null;
    showToast(`Pedido ${order.codigo} creado`);
  };
}

function bindViewOrderModal(m){
  const printBtn = document.getElementById("btn-print-order");
  if(printBtn) printBtn.onclick = () => window.print();
  const cancelOrderBtn = document.getElementById("btn-cancel-order");
  if(cancelOrderBtn) cancelOrderBtn.onclick = async () => {
    if(!confirm("¿Cancelar este pedido?")) return;
    DB.orders = DB.orders.filter(o=>o.id!==m.orderId);
    await persist("orders");
    state.modal = null;
    showToast("Pedido cancelado");
  };
}

function bindEditProductModal(m){
  document.getElementById("ep-save").onclick = async () => {
    const nombre = document.getElementById("ep-nombre").value.trim();
    const precio = Number(document.getElementById("ep-precio").value);
    const unidad = document.getElementById("ep-unidad").value.trim() || "unidad";
    const stockMinimo = Number(document.getElementById("ep-min").value)||0;
    if(!nombre){ showToast("Ingresá el nombre del producto","error"); return; }
    if(m.product){
      Object.assign(m.product, {nombre, precio, unidad, stockMinimo});
    } else {
      const stock = Number(document.getElementById("ep-stock").value)||0;
      const np={id:uid("prod"),nombre,precio,stock:0,stockBy:{},unidad,stockMinimo}; DB.products.push(np); await persist("products"); if(stock>0) await addStockMove({productId:np.id,tipo:"entrada",cantidad:stock,motivo:"Stock inicial",branchId:curBranch()});
    }
    await persist("products");
    state.modal = null;
    showToast("Producto guardado");
  };
  const del = document.getElementById("ep-delete");
  if(del) del.onclick = async () => {
    if(!confirm("¿Eliminar este producto?")) return;
    DB.products = DB.products.filter(p=>p.id!==m.product.id);
    await persist("products");
    state.modal = null;
    showToast("Producto eliminado");
  };
}

function bindStockMoveModal(m){
  m.tipo = m.tipo || "entrada";
  document.getElementById("sm-entrada").onclick = () => { m.tipo="entrada"; render(); };
  document.getElementById("sm-salida").onclick = () => { m.tipo="salida"; render(); };
  document.getElementById("sm-save").onclick = async () => {
    const cantidad = Number(document.getElementById("sm-cantidad").value);
    const motivo = document.getElementById("sm-motivo").value.trim();
    if(!cantidad || cantidad<=0){ showToast("Ingresá una cantidad válida","error"); return; }
    const bid=document.getElementById("sm-branch")?.value||(m.branchId&&m.branchId!=="all"?m.branchId:curBranch());
    if(m.tipo==="salida" && cantidad>stockOf(productById(m.productId),bid)){ showToast("El egreso supera el stock de la sucursal","error"); return; }
    await addStockMove({productId:m.productId, tipo:m.tipo||"entrada", cantidad, motivo, branchId:bid});
    state.modal = null;
    showToast("Movimiento registrado");
  };
}

function bindEditClientModal(m){
  document.getElementById("ec-save").onclick = async () => {
    const nombre = document.getElementById("ec-nombre").value.trim();
    if(!nombre){ showToast("Ingresá el nombre","error"); return; }
    const telefono = document.getElementById("ec-telefono").value.trim();
    const direccion = document.getElementById("ec-direccion").value.trim();
    if(m.client){ Object.assign(m.client, {nombre, telefono, direccion}); }
    else { DB.clients.push({id:uid("cli"), nombre, telefono, direccion}); }
    await persist("clients");
    state.modal = null;
    showToast("Cliente guardado");
  };
}

/* ============================= EXPORTAR (EXCEL / IMAGEN) ============================= */
function exportRowsToExcel(filename, sheetName, rows){
  if(!rows || rows.length===0){ showToast("No hay datos para exportar","error"); return; }
  try{
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0,31));
    XLSX.writeFile(wb, filename);
  }catch(e){ showToast("No se pudo generar el Excel","error"); }
}

async function exportElementToImage(elId, filename){
  const el = document.getElementById(elId);
  if(!el){ showToast("No se encontró el contenido a exportar","error"); return; }
  try{
    const canvas = await html2canvas(el, {backgroundColor:"#ffffff", scale:2});
    const link = document.createElement("a");
    link.download = filename;
    link.href = canvas.toDataURL("image/png");
    link.click();
  }catch(e){ showToast("No se pudo generar la imagen","error"); }
}

function exportToolbar(idPrefix, excelFn, imgTargetId, imgFilename){
  return `
  <div style="display:flex;gap:6px;">
    <button class="btn btn-ghost btn-sm" id="${idPrefix}-xls">⬇ Excel</button>
    <button class="btn btn-ghost btn-sm" id="${idPrefix}-img">⬇ Imagen</button>
  </div>`;
}
function bindExportToolbar(idPrefix, excelFn, imgTargetId, imgFilename){
  const bx = document.getElementById(idPrefix+"-xls");
  if(bx) bx.onclick = excelFn;
  const bi = document.getElementById(idPrefix+"-img");
  if(bi) bi.onclick = () => exportElementToImage(imgTargetId, imgFilename);
}

  <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><b>${t.codigo} · ${esc(branchName(t.origen))} → ${esc(branchName(t.destino))}</b><span>${pill(st[0],st[1],st[2])} ${t.validado?pill("✓ Validado","#14213D","#E1E4EC"):""}</span></div>
  <div class="sm">${fmtDate(t.fecha.slice(0,10))}${t.obs?" · "+esc(t.obs):""}</div>
  ${tbl(["Producto","Enviado","Recibido","Dif."],t.items.map(i=>{const d=i.recibida==null?"":i.recibida-i.cant;return `<tr><td>${esc(productById(i.productId)?.nombre)}</td><td>${i.cant}</td><td>${i.recibida??"—"}</td><td style="color:${d?"var(--red)":"inherit"};font-weight:700">${d===""?"":d}</td></tr>`}).join(""))}
  ${t.obsRec?`<div class="sm">Obs. recepción: ${esc(t.obsRec)}</div>`:""}
  <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
   ${t.estado==="en_transito"&&(!isSuc()||b===t.destino)?`<button class="btn btn-accent btn-sm" data-rc="${t.id}">Recibir y controlar</button>`:""}
   ${!isSuc()&&t.estado!=="en_transito"&&!t.validado?`<button class="btn btn-primary btn-sm" data-tv="${t.id}">Validar control de stock</button>`:""}</div></div>`}).join("")}`;
};
VB.envios=()=>{
  const n=document.getElementById("t-new"); if(n) n.onclick=()=>{state.modal={type:"new-transfer",items:[]};render();};
  on("[data-rc]",el=>{state.modal={type:"recv-transfer",id:el.dataset.rc};render();});
  on("[data-tv]",async el=>{const t=DB.transfers.find(x=>x.id===el.dataset.tv);
    if(t.estado==="con_diferencias"&&!confirm("El envío tiene diferencias. ¿Validar igualmente?"))return;
    t.validado=true;t.fechaVal=new Date().toISOString();await persist("transfers");showToast("Control validado");});
};
MODALS["new-transfer"]={
  r:m=>{m.origen=m.origen||(isSuc()?state.branchId:mainBranch());
    if(!m.destino||m.destino===m.origen)m.destino=DB.branches.find(b=>b.id!==m.origen)?.id;
    return `<div class="modal-box" style="padding:20px"><div style="font-weight:700;font-size:17px;margin-bottom:12px">Nuevo envío de mercadería</div>
    <div class="g2"><div><label class="field-label">Origen</label><select id="t-o" ${isSuc()?"disabled":""}>${brOpts(m.origen)}</select></div><div><label class="field-label">Destino</label><select id="t-d">${brOpts(m.destino,m.origen)}</select></div></div>
    <div style="display:flex;gap:8px;margin:12px 0"><select id="t-p" style="flex:2"><option value="">Producto…</option>${DB.products.filter(p=>stockOf(p,m.origen)>0).map(p=>`<option value="${p.id}">${esc(p.nombre)} (${stockOf(p,m.origen)})</option>`).join("")}</select><input type="number" id="t-q" value="1" min="1" style="flex:1"><button class="btn btn-ghost btn-sm" id="t-add">Agregar</button></div>
    ${m.items.map((i,k)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${i.cant} × ${esc(productById(i.productId)?.nombre)}</span><button class="btn btn-danger btn-sm" data-tx="${k}">✕</button></div>`).join("")}
    <textarea id="t-obs" rows="2" placeholder="Observaciones / transporte" style="margin-top:10px">${esc(m.obs||"")}</textarea>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn btn-ghost" id="modal-cancel">Cancelar</button><button class="btn btn-primary" id="t-ok">Registrar envío</button></div></div>`;},
  b:m=>{
    const sv=()=>{m.obs=document.getElementById("t-obs").value;};
    document.getElementById("t-o").onchange=e=>{sv();m.origen=e.target.value;m.items=[];render();};
    document.getElementById("t-d").onchange=e=>{sv();m.destino=e.target.value;render();};
    document.getElementById("t-add").onclick=()=>{sv();const id=document.getElementById("t-p").value,q=Number(document.getElementById("t-q").value),p=productById(id);
      if(!p||q<=0)return showToast("Elegí producto y cantidad","error");
      if(sm(m.items.filter(i=>i.productId===id),i=>i.cant)+q>stockOf(p,m.origen))return showToast("Supera el stock del origen","error");
      m.items.push({productId:id,cant:q,recibida:null});render();};
    on("[data-tx]",el=>{sv();m.items.splice(Number(el.dataset.tx),1);render();});
    document.getElementById("t-ok").onclick=async()=>{sv();
      if(!m.items.length||!m.destino)return showToast("Agregá productos y destino","error");
      const t={id:uid("env"),codigo:code("E"),origen:m.origen,destino:m.destino,items:m.items,obs:m.obs.trim(),fecha:new Date().toISOString(),estado:"en_transito",validado:false};
      for(const i of t.items) await addStockMove({productId:i.productId,tipo:"salida",cantidad:i.cant,motivo:`Envío ${t.codigo} → ${branchName(t.destino)}`,branchId:t.origen,ref:t.id});
      DB.transfers.push(t);await persist("transfers");state.modal=null;showToast("Envío "+t.codigo+" registrado");};
  }};
MODALS["recv-transfer"]={
  r:m=>{const t=DB.transfers.find(x=>x.id===m.id);
    return `<div class="modal-box" style="padding:20px"><div style="font-weight:700;font-size:17px;margin-bottom:4px">Control de recepción ${t.codigo}</div><div class="sm" style="margin-bottom:12px">Contá la mercadería y cargá lo que realmente llegó.</div>
    ${t.items.map((i,k)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(productById(i.productId)?.nombre)}<br><span class="sm">Enviado: ${i.cant}</span></span><input type="number" min="0" id="rc-${k}" value="${i.cant}" style="width:90px"></div>`).join("")}
    <textarea id="rc-obs" rows="2" placeholder="Observaciones (faltantes, roturas…)" style="margin-top:10px"></textarea>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn btn-ghost" id="modal-cancel">Cancelar</button><button class="btn btn-accent" id="rc-ok">Confirmar recepción</button></div></div>`;},
  b:m=>{document.getElementById("rc-ok").onclick=async()=>{
    const t=DB.transfers.find(x=>x.id===m.id);let dif=false;
    t.items.forEach((i,k)=>{i.recibida=Math.max(0,Number(document.getElementById("rc-"+k).value)||0);if(i.recibida!==i.cant)dif=true;});
    for(const i of t.items) if(i.recibida>0) await addStockMove({productId:i.productId,tipo:"entrada",cantidad:i.recibida,motivo:`Recepción ${t.codigo} desde ${branchName(t.origen)}`,branchId:t.destino,ref:t.id});
    t.estado=dif?"con_diferencias":"recibido";t.obsRec=document.getElementById("rc-obs").value.trim();t.fechaRec=new Date().toISOString();
    await persist("transfers");state.modal=null;showToast(dif?"Recibido con diferencias":"Recepción conforme");};}};

/* ---- Cierres de caja: sucursal rinde, administración valida ---- */
VIEWS.cierres=()=>{
  const suc=isSuc(), b=state.branchId; let top="";
  if(suc){const s=DB.sales.filter(x=>x.sucursalId===b&&!x.cierreId), ef=sm(s.filter(x=>x.medio==="efectivo"),x=>x.total), ot=sm(s,x=>x.total)-ef;
    top=`<div class="card" style="padding:14px;margin-bottom:14px"><b>Cerrar caja de hoy</b><div class="sm">Ventas sin cerrar: ${s.length} · Efectivo esperado <b>${fmtMoney(ef)}</b> · Otros medios ${fmtMoney(ot)}</div>
    <div class="g2" style="margin:10px 0"><div><label class="field-label">Efectivo contado</label><input type="number" id="c-cont"></div><div><label class="field-label">Monto a entregar</label><input type="number" id="c-ent"></div></div>
    <textarea id="c-obs" rows="2" placeholder="Observaciones"></textarea><button class="btn btn-primary" id="c-ok" style="margin-top:10px" ${s.length?"":"disabled"}>Cerrar caja y rendir</button></div>`;}
  const list=DB.closings.filter(c=>!suc||c.sucursalId===b).slice().reverse();
  const pend=DB.closings.filter(c=>c.estado==="rendido");
  return (suc?"":`<div class="kpis">${kpi("A validar",pend.length,pend.length?"var(--amber)":"")}${kpi("Entregado sin validar",fmtMoney(sm(pend,c=>c.entregado)))}${kpi("Validado",fmtMoney(sm(DB.closings.filter(c=>c.estado!=="rendido"),c=>c.recibido||0)))}</div>`)+top+
  (list.length===0?emptyState("Todavía no hay cierres."):list.map(c=>{const st=CST[c.estado];return `<div class="card" style="padding:14px;margin-bottom:10px">
  <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><b>${c.codigo} · ${esc(branchName(c.sucursalId))}</b>${pill(st[0],st[1],st[2])}</div>
  <div class="sm">${fmtDate(c.fecha.slice(0,10))} · ${c.nVentas} ventas · Esperado ${fmtMoney(c.esperado)} · Contado ${fmtMoney(c.contado)} (dif. ${fmtMoney(c.contado-c.esperado)}) · Otros medios ${fmtMoney(c.otros)}</div>
  <div class="sm">Entregado: <b>${fmtMoney(c.entregado)}</b>${c.recibido!=null?` · Recibido por administración: <b>${fmtMoney(c.recibido)}</b> (dif. ${fmtMoney(c.recibido-c.entregado)})`:""}</div>${c.obs?`<div class="sm">Obs: ${esc(c.obs)}</div>`:""}
  ${!suc&&c.estado==="rendido"?`<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input type="number" id="r-${c.id}" placeholder="Monto recibido" style="flex:1;min-width:130px"><button class="btn btn-accent btn-sm" data-cv="${c.id}">Validar entrega</button></div>`:""}</div>`}).join(""));
};
VB.cierres=()=>{
  const ok=document.getElementById("c-ok");
  if(ok) ok.onclick=async()=>{const b=state.branchId,s=DB.sales.filter(x=>x.sucursalId===b&&!x.cierreId);
    const cont=document.getElementById("c-cont").value,ent=document.getElementById("c-ent").value;
    if(cont===""||ent==="")return showToast("Cargá efectivo contado y monto a entregar","error");
    const ef=sm(s.filter(x=>x.medio==="efectivo"),x=>x.total),c={id:uid("cie"),codigo:code("C"),sucursalId:b,fecha:new Date().toISOString(),nVentas:s.length,esperado:ef,otros:sm(s,x=>x.total)-ef,contado:Number(cont),entregado:Number(ent),obs:document.getElementById("c-obs").value.trim(),estado:"rendido",recibido:null};
    s.forEach(x=>x.cierreId=c.id);DB.closings.push(c);await persist("sales");await persist("closings");showToast("Caja cerrada: "+c.codigo);};
  on("[data-cv]",async el=>{const c=DB.closings.find(x=>x.id===el.dataset.cv),v=document.getElementById("r-"+c.id).value;
    if(v==="")return showToast("Ingresá el monto recibido","error");
    const rec=Number(v),d=Math.round((rec-c.entregado)*100)/100;
    if(d!==0&&!confirm(`Recibido ${fmtMoney(rec)} vs entregado ${fmtMoney(c.entregado)} (dif. ${fmtMoney(d)}). ¿Validar igualmente como observado?`))return;
    c.recibido=rec;c.estado=d===0?"validado":"observado";c.fechaVal=new Date().toISOString();await persist("closings");showToast("Entrega validada");});
};

/* ============================= VENTAS (admin), NOVEDADES, USUARIOS ============================= */
const code=p=>p+"-"+Date.now().toString(36).slice(-5).toUpperCase();
VIEWS.ventas=()=>{
  const b=vb(), l=DB.sales.filter(s=>b==="all"||s.sucursalId===b).slice().reverse();
  const med=m=>sm(l.filter(s=>s.medio===m),s=>s.total);
  return `<div class="kpis">${kpi("Total vendido",fmtMoney(sm(l,s=>s.total)))}${kpi("Efectivo",fmtMoney(med("efectivo")))}${kpi("Transferencia",fmtMoney(med("transferencia")))}${kpi("Tarjeta",fmtMoney(med("tarjeta")))}</div>`+
  tbl(["Código","Fecha","Sucursal","Detalle","Medio","Total","Caja"],l.slice(0,200).map(s=>`<tr><td class="font-mono">${s.codigo}</td><td>${new Date(s.fecha).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"})}</td><td>${esc(branchName(s.sucursalId))}</td><td>${s.items.map(i=>i.c+"× "+esc(productById(i.id)?.nombre)).join(", ")}</td><td>${s.medio}</td><td>${fmtMoney(s.total)}</td><td>${s.cierreId?"Cerrada":"Abierta"}</td></tr>`).join(""));
};
const RT={rotura:"Rotura / pérdida",reemplazo:"Reemplazo de bidón",rendicion:"Rendición de cuentas",necesidad:"Necesidad / pedido de stock",otro:"Otro"};
const RST={abierta:["Abierta","#C07A2A","#F6E9D6"],respondida:["Respondida","#1D4E89","#DCE7F5"],resuelta:["Resuelta","#1E7A63","#E4F1EC"]};
VIEWS.novedades=()=>{
  const suc=isSuc(), l=DB.requests.filter(r=>suc?r.sucursalId===state.branchId:(vb()==="all"||r.sucursalId===vb())).slice().reverse().sort((a,b)=>(a.estado==="resuelta")-(b.estado==="resuelta"));
  const form=suc?`<div class="card" style="padding:14px;margin-bottom:14px"><b>Nueva novedad para administración</b>
  <div class="g2" style="margin:10px 0"><div><label class="field-label">Tipo</label><select id="n-t">${Object.entries(RT).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div><div><label class="field-label">Producto (opcional)</label><select id="n-p"><option value="">—</option>${DB.products.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join("")}</select></div></div>
  <div style="margin-bottom:10px"><label class="field-label">Cantidad (opcional)</label><input type="number" id="n-q" min="1"></div>
  <textarea id="n-d" rows="3" placeholder="Detalle: qué pasó, qué se necesita…"></textarea><button class="btn btn-primary" id="n-ok" style="margin-top:10px">Enviar</button></div>`:"";
  return form+(l.length===0?emptyState("No hay novedades."):l.map(r=>{const st=RST[r.estado],p=productById(r.productId);return `<div class="card" style="padding:14px;margin-bottom:10px">
  <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><b>${r.codigo} · ${RT[r.tipo]}${suc?"":" · "+esc(branchName(r.sucursalId))}</b>${pill(st[0],st[1],st[2])}</div>
  <div class="sm">${new Date(r.fecha).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"})} · ${esc(r.autor)}${p?` · ${r.cantidad||""} ${esc(p.nombre)}`:""}${r.egreso?" · egreso aplicado":""}</div>
  <div style="margin-top:6px">${esc(r.detalle)}</div>${r.respuesta?`<div style="margin-top:8px;padding:8px 10px;background:var(--teal-soft);border-radius:7px"><b>Administración:</b> ${esc(r.respuesta)}</div>`:""}
  ${!suc&&r.estado!=="resuelta"?`<textarea id="rs-${r.id}" rows="2" placeholder="Respuesta…" style="margin-top:8px">${esc(r.respuesta||"")}</textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn btn-ghost btn-sm" data-rs="${r.id}">Responder</button><button class="btn btn-accent btn-sm" data-rz="${r.id}">Responder y resolver</button>${p&&r.cantidad&&["rotura","reemplazo"].includes(r.tipo)&&!r.egreso?`<button class="btn btn-danger btn-sm" data-eg="${r.id}">Aplicar egreso de stock</button>`:""}</div>`:""}</div>`}).join(""));
};
VB.novedades=()=>{
  const ok=document.getElementById("n-ok");
  if(ok) ok.onclick=async()=>{const d=document.getElementById("n-d").value.trim();if(!d)return showToast("Escribí el detalle","error");
    DB.requests.push({id:uid("req"),codigo:code("N"),sucursalId:state.branchId,tipo:document.getElementById("n-t").value,productId:document.getElementById("n-p").value||null,cantidad:Number(document.getElementById("n-q").value)||null,detalle:d,estado:"abierta",autor:PROFILE.nombre,fecha:new Date().toISOString(),respuesta:"",egreso:false});
    await persist("requests");showToast("Enviado a administración");};
  const resp=async(id,fin)=>{const r=DB.requests.find(x=>x.id===id);r.respuesta=document.getElementById("rs-"+id).value.trim();r.estado=fin?"resuelta":(r.respuesta?"respondida":"abierta");r.fechaResp=new Date().toISOString();await persist("requests");};
  on("[data-rs]",el=>resp(el.dataset.rs,false));on("[data-rz]",el=>resp(el.dataset.rz,true));
  on("[data-eg]",async el=>{const r=DB.requests.find(x=>x.id===el.dataset.eg);if(!confirm(`¿Descontar ${r.cantidad} de ${productById(r.productId).nombre} en ${branchName(r.sucursalId)}?`))return;
    await addStockMove({productId:r.productId,tipo:"salida",cantidad:r.cantidad,motivo:"Baja reportada "+r.codigo,branchId:r.sucursalId});r.egreso=true;await persist("requests");});
};
VIEWS.usuarios=()=>`<div class="card" style="padding:14px;margin-bottom:14px"><b>Nuevo usuario</b>
  <div class="g2" style="margin:10px 0"><div><label class="field-label">Nombre</label><input type="text" id="u-n"></div><div><label class="field-label">Usuario</label><input type="text" id="u-u" autocapitalize="off"></div>
  <div><label class="field-label">Contraseña (mín. 6)</label><input type="text" id="u-p" autocapitalize="off"></div><div><label class="field-label">Perfil</label><select id="u-r"><option value="vendedor">Vendedor de sucursal</option><option value="operario">Operario de producción</option><option value="admin">Administrador</option></select></div>
  <div><label class="field-label">Sucursal</label><select id="u-s">${brOpts()}</select></div></div><button class="btn btn-primary" id="u-ok">Crear usuario</button></div>`+
  tbl(["Nombre","Usuario","Perfil","Sucursal","Estado",""],PROFS.map(p=>`<tr><td>${esc(p.nombre)}</td><td>${esc(p.usuario)}</td><td>${p.rol}</td><td>${p.rol==="admin"?"—":esc(branchName(p.sucursal_id))}</td><td>${p.activo===false?"Deshabilitado":"Activo"}</td><td>${p.id===AUTH.uid?"":`<button class="btn btn-ghost btn-sm" data-ua="${p.id}">${p.activo===false?"Habilitar":"Deshabilitar"}</button>`}</td></tr>`).join(""));
VB.usuarios=()=>{
  document.getElementById("u-ok").onclick=async()=>{
    const n=document.getElementById("u-n").value.trim(),u=document.getElementById("u-u").value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,""),pw=document.getElementById("u-p").value,rol=document.getElementById("u-r").value,suc=document.getElementById("u-s").value;
    if(!n||!u||pw.length<6)return showToast("Completá nombre, usuario y contraseña (mín. 6)","error");
    if(PROFS.some(p=>p.usuario===u))return showToast("Ese usuario ya existe","error");
    try{
      const r=await authCall("signup",{email:uMail(u),password:pw});const j=await r.json();
      if(!r.ok)throw new Error(j.msg||j.error_description||"No se pudo crear la cuenta");
      const id=j.user?j.user.id:j.id;
      const q=await API("/rest/v1/profiles",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({id,usuario:u,nombre:n,rol,sucursal_id:rol==="admin"?null:suc,activo:true})});
      if(!q.ok)throw new Error("Cuenta creada pero falló el perfil");
      await pull();render();showToast("Usuario creado");
    }catch(e){showToast(e.message,"error");}
  };
  on("[data-ua]",async el=>{const p=PROFS.find(x=>x.id===el.dataset.ua);
    const r=await API("/rest/v1/profiles?id=eq."+p.id,{method:"PATCH",body:JSON.stringify({activo:p.activo===false})});
    if(r.ok){p.activo=p.activo===false;render();}else showToast("No se pudo actualizar","error");});
};

MODALS["chg-pass"]={
  r:m=>`<div class="modal-box" style="padding:20px;max-width:380px"><div style="font-weight:700;font-size:17px;margin-bottom:12px">Cambiar mi contraseña</div>
  <div style="display:flex;flex-direction:column;gap:10px"><div><label class="field-label">Nueva contraseña (mín. 6)</label><input type="password" id="cp1" autocomplete="new-password"></div><div><label class="field-label">Repetir contraseña</label><input type="password" id="cp2" autocomplete="new-password"></div></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn btn-ghost" id="modal-cancel">Cancelar</button><button class="btn btn-primary" id="cp-ok">Guardar</button></div></div>`,
  b:m=>{document.getElementById("cp-ok").onclick=async()=>{
    const a=document.getElementById("cp1").value,b=document.getElementById("cp2").value;
    if(a.length<6)return showToast("Mínimo 6 caracteres","error");
    if(a!==b)return showToast("Las contraseñas no coinciden","error");
    const r=await API("/auth/v1/user",{method:"PUT",body:JSON.stringify({password:a})});
    if(!r.ok)return showToast("No se pudo cambiar la contraseña","error");
    state.modal=null;showToast("Contraseña actualizada");};}};

loadAll();
